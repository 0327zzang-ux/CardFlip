<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1016">
  <title>CardFlip : 차세대 인터랙티브 3D 디지털 명함</title>
  
  <link rel="stylesheet" href="css/style.css">
  
  <!-- 오프라인 무결점 구동을 위한 로컬 라이브러리 -->
  <script src="js/three.min.js"></script>
  <script src="js/qrcode.min.js"></script>
</head>
<body>

  <div id="app-container">
    
    <!-- 상단 헤더 -->
    <header class="app-header">
      <button id="hamburger-btn" class="header-btn" title="교환한 명함첩">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="header-title">
        <h1>CardFlip 3D</h1>
        <span id="active-card-tag">DIGITAL WALLET</span>
      </div>

      <button id="flip-btn" class="flip-btn" title="앞뒷면 180도 뒤집기">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"></polyline>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <polyline points="7 23 3 19 7 15"></polyline>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
        <span>뒤집기</span>
      </button>
    </header>

    <!-- 2축 제스처 조작 가이드 오버레이 -->
    <div class="gesture-hints">
      <div class="hint-arrow hint-up">
        <span>▲ 스킨 변경 (↑)</span>
      </div>
      <div class="hint-arrow hint-left">
        <span>◀ 이전 (←)</span>
      </div>
      <div class="hint-arrow hint-right">
        <span>다음 (→) ▶</span>
      </div>
      <div class="hint-arrow hint-down">
        <span>▼ 스킨 변경 (↓)</span>
      </div>
    </div>

    <!-- 3D Three.js 스테이지 컨테이너 -->
    <div id="canvas-container"></div>

    <!-- 명함 내 스마트 하이퍼링크 독 (클릭 시 새 창 접속) -->
    <div id="links-dock" class="card-links-dock"></div>

    <!-- 하단 컨트롤 바 -->
    <footer class="bottom-controls">
      <div id="card-indicator" class="card-indicator-badge">명함 1/3</div>

      <!-- 중앙 플로팅 QR 카메라 교환 버튼 -->
      <button id="qr-camera-btn" class="qr-camera-btn" title="QR 코드 촬영 / 고유 ID 교환">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </button>

      <div id="skin-indicator" class="card-indicator-badge" style="color: #38bdf8;">스킨: 홀로그램</div>
    </footer>

    <!-- 바텀 시트: QR 코드 촬영 및 고유 ID 교환 모달 -->
    <div id="exchange-sheet" class="bottom-sheet">
      <div id="sheet-handle" class="sheet-handle"></div>
      
      <div class="sheet-header">
        <span class="sheet-title">명함 교환하기</span>
        <button id="sheet-close-btn" class="sheet-close">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- 카메라 뷰파인더 -->
      <div class="camera-viewfinder">
        <video id="camera-video" autoplay playsinline muted></video>
        <div class="scanner-overlay"></div>
      </div>

      <!-- 1초 테스트 QR 스캔 시연 버튼 -->
      <button id="demo-qr-btn" class="demo-qr-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>⚡ 1초 테스트 QR 자동 인식 (시연용)</span>
      </button>

      <!-- 고유 ID 직접 입력 교환 -->
      <div class="id-input-group">
        <input type="text" id="exchange-id-input" placeholder="상대방 고유 ID (예: @sarah_art)">
        <button id="exchange-id-submit" class="id-submit-btn">교환 요청</button>
      </div>

      <!-- 내 명함 QR 토글 버튼 -->
      <button id="toggle-my-qr-btn" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#cbd5e1;padding:8px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;">
        내 대표 명함 QR 코드 보기 / 복사
      </button>
      <div id="my-qr-container" style="display:none;justify-content:center;margin-top:12px;padding:12px;background:white;border-radius:12px;"></div>
    </div>

    <!-- 좌측 드로어: 소속/직무 기반 지능형 명함첩 -->
    <div id="wallet-drawer" class="drawer">
      <div class="drawer-header">
        <span class="drawer-title">교환된 명함첩</span>
        <button id="drawer-close-btn" class="sheet-close">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- 필터 탭 바 -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="all">전체 보기</button>
        <button class="tab-btn" data-tab="affiliation">🏢 소속별 분류</button>
        <button class="tab-btn" data-tab="occupation">💼 직무별 분류</button>
        <button class="tab-btn" data-tab="starred">⭐ 즐겨찾기</button>
      </div>

      <!-- 명함 목록 영역 -->
      <div id="wallet-list" class="wallet-list"></div>

      <!-- 하단 시연 초기화 버튼 -->
      <div style="padding: 16px; border-top: 1px solid rgba(255,255,255,0.08);">
        <button id="reset-data-btn" style="width:100%;padding:10px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;">
          🔄 시연 샘플 데이터 초기화
        </button>
      </div>
    </div>

    <!-- 신규 명함 작성 모달 -->
    <div id="new-card-modal" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:70;justify-content:center;align-items:center;padding:24px;">
      <div style="background:#181926;border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:20px;width:100%;max-width:340px;">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:14px;color:white;">새 디지털 명함 만들기</h3>
        <input type="text" id="new-name" placeholder="이름 (예: 홍길동)" style="width:100%;padding:9px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:white;font-size:13px;margin-bottom:8px;outline:none;">
        <input type="text" id="new-aff" placeholder="소속 (예: 스타트업 / 한국대)" style="width:100%;padding:9px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:white;font-size:13px;margin-bottom:8px;outline:none;">
        <input type="text" id="new-occ" placeholder="직무 (예: AI 개발자)" style="width:100%;padding:9px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:white;font-size:13px;margin-bottom:8px;outline:none;">
        <input type="email" id="new-email" placeholder="이메일" style="width:100%;padding:9px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:white;font-size:13px;margin-bottom:8px;outline:none;">
        <input type="tel" id="new-phone" placeholder="전화번호" style="width:100%;padding:9px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:white;font-size:13px;margin-bottom:14px;outline:none;">
        <div style="display:flex;gap:8px;">
          <button id="new-card-cancel" style="flex:1;padding:9px;background:rgba(255,255,255,0.08);border:none;border-radius:8px;color:#94a3b8;font-size:13px;font-weight:600;cursor:pointer;">취소</button>
          <button id="new-card-submit" style="flex:1;padding:9px;background:#2563eb;border:none;border-radius:8px;color:white;font-size:13px;font-weight:600;cursor:pointer;">명함 생성</button>
        </div>
      </div>
    </div>

    <!-- 플로팅 토스트 피드백 -->
    <div id="toast" class="toast">안내 메시지</div>

  </div>

  <!-- 비즈니스 로직 스크립트 순차 로드 -->
  <script src="js/wallet.js"></script>
  <script src="js/card3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
